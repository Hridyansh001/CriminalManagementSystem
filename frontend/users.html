<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRMS > CITIZEN DIRECTORY</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <div class="terminal-container">
        <!-- Dynamic Header / Navbar -->
        <div id="navbar-container"></div>

        <div class="terminal-toolbar">
            <div style="font-size: 14px; font-weight: bold; color: #222222;">
                REGISTERED CITIZENS DIRECTORY
            </div>
            <button class="btn btn-success" onclick="openAddModal()">[ + ADD CITIZEN ]</button>
        </div>
        <hr>

        <div id="alert-box" class="alert"></div>

        <!-- Filter & Search Toolbar -->
        <div class="terminal-toolbar">
            <div class="search-prompt">
                <span>&gt; SEARCH:</span>
                <input type="text" id="searchInput" placeholder="Enter name, email, phone..." onkeyup="filterTable()">
            </div>
            <button class="btn btn-secondary btn-sm" onclick="loadUsers()">[ REFRESH ]</button>
        </div>

        <!-- User Data Table -->
        <div class="terminal-table-wrapper">
            <table class="terminal-table" id="userTable">
                <thead>
                    <tr>
                        <th>USER ID</th>
                        <th>NAME</th>
                        <th>EMAIL</th>
                        <th>PHONE</th>
                        <th>DOB</th>
                        <th>GENDER</th>
                        <th>ADDRESS</th>
                        <th>ACTION</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <tr><td colspan="8" class="no-data">Querying citizen accounts...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- User Modal (Add / Edit) -->
        <div id="userModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 id="modalTitle">REGISTER CITIZEN ACCOUNT</h3>
                    <button class="modal-close" onclick="closeModal('userModal')">[X]</button>
                </div>
                <form id="userForm" onsubmit="saveUser(event)">
                    <input type="hidden" id="userId">

                    <div class="form-grid">
                        <div class="term-field">
                            <label for="name">Full Name *</label>
                            <div class="input-wrapper">
                                <span class="prompt">&gt;</span>
                                <input type="text" id="name" required placeholder="Full name">
                            </div>
                        </div>

                        <div class="term-field">
                            <label for="email">Email *</label>
                            <div class="input-wrapper">
                                <span class="prompt">&gt;</span>
                                <input type="email" id="email" required placeholder="name@email.com">
                            </div>
                        </div>

                        <div class="term-field">
                            <label for="phone">Phone Number</label>
                            <div class="input-wrapper">
                                <span class="prompt">&gt;</span>
                                <input type="tel" id="phone" placeholder="Phone #">
                            </div>
                        </div>

                        <div class="term-field">
                            <label for="dob">Date of Birth</label>
                            <div class="input-wrapper">
                                <span class="prompt">&gt;</span>
                                <input type="date" id="dob">
                            </div>
                        </div>

                        <div class="term-field">
                            <label for="gender">Gender</label>
                            <div class="input-wrapper">
                                <span class="prompt">&gt;</span>
                                <select id="gender">
                                    <option value="">Select</option>
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                        </div>

                        <div class="term-field">
                            <label for="password">Password *</label>
                            <div class="input-wrapper">
                                <span class="prompt">&gt;</span>
                                <input type="password" id="password" required placeholder="Password">
                            </div>
                        </div>

                        <div class="term-field form-group full-width">
                            <label for="residentialAddress">Residential Address</label>
                            <div class="input-wrapper" style="padding:0;">
                                <textarea id="residentialAddress" rows="2" placeholder="Full address..."></textarea>
                            </div>
                        </div>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" onclick="closeModal('userModal')">[ CANCEL ]</button>
                        <button type="submit" class="btn btn-success">[ SAVE USER ]</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- View User Modal -->
        <div id="viewModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>CITIZEN USER DETAILS</h3>
                    <button class="modal-close" onclick="closeModal('viewModal')">[X]</button>
                </div>
                <ul class="details-list" id="userDetailsContent"></ul>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeModal('viewModal')">[ CLOSE ]</button>
                </div>
            </div>
        </div>

        <footer>
            CRMS &bull; DBMS Project Terminal Interface
        </footer>
    </div>

    <script src="js/config.js"></script>
    <script src="js/users.js"></script>
</body>
</html>
